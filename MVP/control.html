<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>智慧冰箱收納盒 · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:           #F4F2EC;
  --bg-elev:      #FBFAF6;
  --card:         #FFFFFF;
  --card-soft:    #F8F7F2;
  --line:         rgba(20,30,22,.07);
  --line-strong:  rgba(20,30,22,.12);

  --ink:          #1A1F1A;
  --ink-2:        #4B514A;
  --ink-3:        #828780;
  --ink-on-dark:  #F6F4EE;

  --brand:        #2F7A5C;
  --brand-600:    #28694F;
  --brand-700:    #1F5740;
  --brand-soft:   #E6F0EA;
  --brand-tint:   #F1F7F3;

  --ok:           #2F7A5C;
  --ok-bg:        #E8F1EC;
  --ok-line:      #BFDCC9;

  --warn:         #A06D11;
  --warn-bg:      #FAF1D9;
  --warn-line:    #ECD78A;

  --bad:          #B0463A;
  --bad-bg:       #FBE6E1;
  --bad-line:     #EFB6AC;

  --mute:         #6A6F69;
  --mute-bg:      #EFEEE9;
  --mute-line:    #D9D7D0;

  --box-veg:      #6BAE7E;
  --box-meat:     #C66B5E;
  --box-fish:     #8A9099;
  --box-dairy:    #D9C99B;
  --box-fruit:    #E1A35E;
  --box-cooked:   #6E92B0;
  --box-drink:    #BFD3D9;
  --box-other:    #B7B4AC;

  --r-xs: 8px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-1: 0 1px 0 rgba(20,30,22,.04), 0 1px 2px rgba(20,30,22,.04);
  --sh-2: 0 1px 0 rgba(20,30,22,.04), 0 8px 24px -8px rgba(20,40,25,.10);
  --sh-3: 0 12px 32px -10px rgba(20,40,25,.18);

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 32px; --s-8: 48px; --s-9: 64px;

  --sidebar-w: 304px;
  --content-max: 1040px;
  --header-h: 64px;

  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
  --font-num: "Plus Jakarta Sans", "Noto Sans TC", system-ui, sans-serif;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: .005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  overflow-wrap: break-word;
}
.content > *, .row-2 > *{ min-width: 0; }
.btn, .chip, .badge, .tag,
.section-title, .section-meta, .section-link,
.box-name, .box-type, .cap-num,
.priority-eyebrow, .waste-eyebrow,
.brand-name, .brand-meta,
.hi-time, .sb-title,
.fab,
.it-meta > span, .p-days, .it-days,
.confidence{
  white-space: nowrap;
}
.it-meta, .brand-meta, .hi-meta{ flex-wrap: wrap; }
button{ font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
ul{ list-style:none; padding:0; margin:0; }
a{ color: inherit; }
img{ max-width:100%; display:block; }

.num{ font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

.hidden{ display: none !important; }

/* ============================================================
   APP SHELL
   ============================================================ */
.app{
  display: grid;
  grid-template-columns: 0 1fr;
  min-height: 100vh;
  transition: grid-template-columns .28s cubic-bezier(.2,.7,.2,1);
}
.app[data-sidebar="open"]{ grid-template-columns: var(--sidebar-w) 1fr; }

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  position: sticky; top: 0;
  height: 100vh;
  width: var(--sidebar-w);
  background: var(--bg-elev);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  overflow: hidden;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.2,.7,.2,1);
}
.app[data-sidebar="open"] .sidebar{ transform: translateX(0); }

.sb-head{
  display:flex; align-items:center; justify-content:space-between;
  padding: var(--s-5) var(--s-5) var(--s-3);
}
.sb-title{ font-size: 13px; font-weight:600; color: var(--ink-2); letter-spacing:.04em; text-transform: uppercase; }
.sb-close{
  width:32px; height:32px; border-radius: var(--r-sm);
  display:grid; place-items:center; color: var(--ink-2);
}
.sb-close:hover{ background: var(--mute-bg); color: var(--ink); }

.sb-actions{
  padding: 0 var(--s-5) var(--s-3);
  display: grid;
  gap: 6px;
}
.sb-actions button{
  width:100%; height: 36px; padding: 0 12px;
  font-size: 13px; font-weight: 500;
  border: 1px solid var(--line);
  background: var(--card); color: var(--ink-2);
  border-radius: var(--r-sm);
  transition: background .15s, color .15s, box-shadow .15s, transform .08s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.sb-actions button:hover{ background: var(--card-soft); color: var(--ink); }
.sidebar-new-scan-btn{
  background: var(--brand) !important;
  color: #fff !important;
  border-color: transparent !important;
  font-weight: 600 !important;
  height: 40px !important;
  font-size: 14px !important;
  box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 14px -4px rgba(47,122,92,.4);
}
.sidebar-new-scan-btn:hover{
  background: var(--brand-600) !important;
  color: #fff !important;
}
.sidebar-new-scan-btn:active{ transform: translateY(1px); }

.sb-list{
  padding: var(--s-2) var(--s-3) var(--s-5);
  overflow-y: auto;
  flex: 1;
}
.history-item{
  display:block; width:100%; text-align:left;
  padding: 10px var(--s-3);
  border-radius: var(--r-sm);
  color: var(--ink);
  margin-bottom: 2px;
  position:relative;
  transition: background .12s;
  background: transparent;
  border: 0;
  font: inherit;
}
.history-item:hover{ background: var(--card); }
.history-item .hi-row{ display:flex; align-items:center; gap:8px; }
.history-item .hi-time{
  font-size: 12px; color: var(--ink-3); font-family: var(--font-num);
}
.history-item .hi-summary{
  font-size: 13.5px; color: var(--ink); margin-top: 2px;
  line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow:hidden;
}
.history-item .hi-meta{
  display:flex; align-items:center; gap: 8px;
  font-size: 12px; color: var(--ink-3); margin-top: 6px;
}
.history-item.is-active{
  background: var(--brand-soft);
}
.history-item.is-active::before{
  content:""; position:absolute; left:-3px; top:8px; bottom:8px; width:3px;
  border-radius: 0 3px 3px 0; background: var(--brand);
}
.history-item.is-active .hi-summary{ color: var(--brand-700); font-weight:500; }
.history-item .hi-del{
  position:absolute; right:8px; top:50%; transform: translateY(-50%);
  width:24px; height:24px; border-radius:6px; display:none; align-items:center; justify-content:center;
  color: var(--ink-3);
  background: transparent; border: 0;
}
.history-item:hover .hi-del{ display:inline-flex; }
.history-item .hi-del:hover{ background: var(--bad-bg); color: var(--bad); }

.sb-empty{
  padding: var(--s-5) var(--s-3);
  text-align: center;
  color: var(--ink-3);
  font-size: 13px;
}

/* sidebar overlay (mobile) */
.scrim{
  position: fixed; inset: 0;
  background: rgba(20,30,22,.32);
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
  z-index: 40;
  backdrop-filter: blur(2px);
}

/* ============================================================
   MAIN
   ============================================================ */
.main{ min-width:0; display:flex; flex-direction:column; }

/* ---- HEADER ---- */
.header{
  position: sticky; top: 0; z-index: 30;
  background: rgba(244,242,236,.86);
  backdrop-filter: saturate(140%) blur(12px);
  -webkit-backdrop-filter: saturate(140%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.header-inner{
  max-width: var(--content-max);
  margin: 0 auto;
  padding: var(--s-3) var(--s-5);
  display:flex; align-items:center; gap: var(--s-3);
  min-height: var(--header-h);
}
.icon-btn{
  width: 40px; height: 40px; border-radius: var(--r-md);
  display:grid; place-items:center; color: var(--ink-2);
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.icon-btn:hover{ background: var(--mute-bg); color: var(--ink); }
.icon-btn.is-on{ background: var(--brand-soft); color: var(--brand-700); }

.brand{
  display:flex; align-items:center; gap: 10px;
  margin-right: auto;
  min-width: 0;
}
.brand-mark{
  width: 34px; height: 34px; border-radius: 10px;
  background:
    radial-gradient(120% 120% at 0% 0%, #6FB78F 0%, #2F7A5C 70%);
  display:grid; place-items:center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 4px 10px -4px rgba(47,122,92,.45);
  color:#fff;
  flex-shrink: 0;
}
.brand-text{ min-width: 0; }
.brand-name{
  font-weight: 600; font-size: 15px; line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis;
}
.brand-meta{
  font-size: 12px; color: var(--ink-3); margin-top: 1px;
  display:flex; align-items:center; gap: 6px;
  overflow: hidden; text-overflow: ellipsis;
}
.dot{ width:6px; height:6px; border-radius:50%; background: var(--ink-3); display:inline-block; flex-shrink: 0; }
.dot.is-ok{ background: var(--ok); box-shadow: 0 0 0 3px rgba(47,122,92,.16); }
.dot.is-warn{ background: var(--warn); }
.dot.is-bad{ background: var(--bad); }

.btn{
  display:inline-flex; align-items:center; gap: 8px;
  height: 40px; padding: 0 16px;
  border-radius: var(--r-pill);
  font-weight: 600; font-size: 14px;
  background: var(--card); color: var(--ink);
  box-shadow: var(--sh-1);
  border: 1px solid var(--line);
  transition: transform .08s, box-shadow .15s, background .15s;
  white-space: nowrap;
}
.btn:hover{ box-shadow: var(--sh-2); }
.btn:active{ transform: translateY(1px); }
.btn-primary{
  background: var(--brand); color: #fff; border-color: transparent;
  box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 6px 14px -4px rgba(47,122,92,.45);
}
.btn-primary:hover{ background: var(--brand-600); }
.btn-primary:disabled{ background: #9DBFAE; color:#fff; cursor: not-allowed; box-shadow:none; }
.btn-ghost{ background: transparent; border-color: transparent; box-shadow: none; }
.btn-ghost:hover{ background: var(--mute-bg); }
.btn-sm{ height: 32px; padding: 0 12px; font-size: 13px; border-radius: var(--r-pill); }

/* ---- CONTENT GRID ---- */
.content{
  max-width: var(--content-max);
  margin: 0 auto;
  width: 100%;
  padding: var(--s-5) var(--s-5) calc(var(--s-9) + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--s-5);
}

/* ---- STATUS / REVIEW BANNER ---- */
.status-area{
  display: grid; gap: var(--s-2);
}
.status-msg{
  font-size: 14px;
  color: var(--ink-2);
  padding: 4px 2px;
}
.status-msg.ok   { color: var(--ok); }
.status-msg.warn { color: var(--warn); }
.status-msg.err  { color: var(--bad); }
.status-line{
  font-size: 12px; color: var(--ink-3);
  padding: 0 2px;
}

.review-banner{
  padding: 10px 14px;
  background: #FBF3DD; border:1px solid #ECD78A;
  border-radius: var(--r-md); color: #6A4C00;
  font-size: 13.5px;
  display:flex; align-items:center; gap: 10px; flex-wrap: wrap;
}
.review-banner-text{ flex: 1; min-width: 0; }
.review-banner-actions{
  display:flex; gap: 6px; flex-wrap: wrap;
}
.review-banner button{
  padding: 4px 10px; font-size: 12px;
  border-radius: var(--r-pill);
  background: #fff;
  color: var(--brand-700);
  font-weight: 600;
  border: 1px solid var(--warn-line);
}
.review-banner button:hover{ background: var(--warn-bg); }

/* ---- SECTION HEADERS ---- */
.section-head{
  display:flex; align-items:baseline; justify-content: space-between;
  margin: var(--s-3) 2px var(--s-3);
  gap: 8px;
}
.section-title{ font-size: 18px; font-weight:600; color: var(--ink); letter-spacing:-.005em; }
.section-meta{ font-size: 13px; color: var(--ink-3); }
.section-link{ font-size: 13px; color: var(--brand-700); font-weight:500; }

/* ---- BASE CARD ---- */
.card{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
}
.card-pad{ padding: var(--s-5); }

.empty{
  font-size: 13px; color: var(--ink-3); padding: 12px 4px;
}

/* ============================================================
   1. PRIORITY HERO
   ============================================================ */
.priority{
  background:
    radial-gradient(120% 100% at 0% 0%, #F1F7F3 0%, transparent 55%),
    linear-gradient(180deg, #FFFFFF 0%, #FCFBF7 100%);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: var(--s-6);
  box-shadow: var(--sh-2);
  position: relative;
  overflow: hidden;
}
.priority.is-calm{
  background:
    radial-gradient(120% 100% at 0% 0%, #E6F0EA 0%, transparent 55%),
    linear-gradient(180deg, #FFFFFF 0%, #FCFBF7 100%);
}
.priority::after{
  content:""; position:absolute; inset:0;
  border-radius: inherit;
  pointer-events:none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
.priority-eyebrow{
  display:flex; align-items:center; gap: 8px;
  font-size: 12.5px; color: var(--ink-2); font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: var(--s-3);
}
.priority-eyebrow .pulse{
  width:7px; height:7px; border-radius:50%; background: var(--warn);
  box-shadow: 0 0 0 0 rgba(160,109,17,.5);
  animation: pulse 1.8s ease-out infinite;
}
.priority.is-calm .priority-eyebrow .pulse{
  background: var(--ok);
  animation: none;
  box-shadow: 0 0 0 3px rgba(47,122,92,.16);
}
@keyframes pulse{ 0%{ box-shadow: 0 0 0 0 rgba(160,109,17,.45);} 70%{ box-shadow: 0 0 0 8px rgba(160,109,17,0);} 100%{ box-shadow: 0 0 0 0 rgba(160,109,17,0);} }

.priority-headline{
  font-size: clamp(20px, 4.2vw, 26px);
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -.01em;
  color: var(--ink);
  margin: 0 0 var(--s-3);
  text-wrap: pretty;
}
.priority-headline em{
  font-style: normal;
  background: linear-gradient(180deg, transparent 60%, #FBE6B0 60%);
  padding: 0 2px;
}
.priority-list{
  display: grid;
  gap: var(--s-2);
  margin-top: var(--s-4);
}
.p-item{
  display: grid;
  grid-template-columns: 36px 1fr;
  gap: var(--s-3);
  align-items: start;
  padding: var(--s-3);
  background: var(--card-soft);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
}
.p-item .stat-orb{ margin: 0; }
.p-name{ font-weight:600; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.p-reason{ font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
.p-action{ font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }

/* status orb */
.stat-orb{
  width: 36px; height: 36px; border-radius: 50%;
  display:grid; place-items:center;
  border:1px solid var(--line-strong);
  background: var(--mute-bg); color: var(--mute);
  flex: none;
}
.stat-orb[data-s="green"]   { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok-line); }
.stat-orb[data-s="yellow"]  { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.stat-orb[data-s="red"]     { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad-line); }
.stat-orb[data-s="unknown"] { background: var(--mute-bg); color: var(--mute); border-color: var(--mute-line); }

/* ============================================================
   ROW-2 GRID
   ============================================================ */
.row-2{
  display:grid; grid-template-columns: 1fr; gap: var(--s-5);
}
@media (min-width: 880px){
  .row-2{ grid-template-columns: 1.15fr .85fr; }
}

/* ============================================================
   RECIPES
   ============================================================ */
.recipes{
  display:grid; gap: var(--s-3);
  grid-template-columns: 1fr;
}
@media (min-width: 540px){
  .recipes{ grid-template-columns: 1fr 1fr; }
}
.recipe{
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-4);
  display:flex; flex-direction:column; gap: 10px;
  box-shadow: var(--sh-1);
  transition: transform .15s, box-shadow .2s, border-color .15s;
}
.recipe:hover{ transform: translateY(-1px); box-shadow: var(--sh-2); border-color: var(--line-strong); }
.recipe-thumb{
  height: 64px; border-radius: var(--r-md);
  background: linear-gradient(135deg, #DCE9D7, #9CC09A);
  display:flex; align-items:flex-end; padding: 8px 10px;
  font-size: 11px; color: rgba(20,50,30,.65); font-weight:500;
  position: relative; overflow:hidden;
}
.recipe-thumb.thumb-1{ background: linear-gradient(135deg, #F0E5C8, #D6BE8C); color: rgba(50,40,20,.6); }
.recipe-thumb.thumb-2{ background: linear-gradient(135deg, #E5D5BD, #B68F5E); color: rgba(70,40,10,.65); }
.recipe-thumb.thumb-3{ background: linear-gradient(135deg, #DCE9D7, #9CC09A); color: rgba(20,50,30,.65); }
.recipe-thumb::after{
  content:""; position:absolute; inset:auto -20% -40% auto;
  width: 90px; height: 90px; border-radius: 50%;
  background: rgba(255,255,255,.18);
}
.recipe h4{ margin: 0; font-size: 15.5px; font-weight: 600; }
.recipe .ings{
  display:flex; flex-wrap: wrap; gap: 4px;
}
.tag{
  display:inline-flex; align-items:center;
  height: 22px; padding: 0 8px;
  font-size: 12px; color: var(--ink-2);
  background: var(--mute-bg);
  border-radius: var(--r-pill);
}
.recipe .reason{ font-size: 13px; color: var(--ink-2); margin-top: auto; line-height: 1.5; }

/* ============================================================
   SHOPPING REMINDER
   ============================================================ */
.shop-list{ display: grid; gap: 8px; }
.shop-row{
  display:grid; grid-template-columns: 28px 1fr; gap: 12px;
  align-items: flex-start;
  padding: 12px 14px;
  background: var(--card-soft);
  border-radius: var(--r-md);
  border: 1px solid var(--line);
}
.shop-row .shop-icon{
  width:28px; height:28px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn);
  display:grid; place-items:center;
}
.shop-row.is-ok .shop-icon{ background: var(--ok-bg); color: var(--ok); }
.shop-row p{ margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }

/* ============================================================
   BOX OVERVIEW
   ============================================================ */
.boxes{
  display:grid; gap: var(--s-3);
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
}
.box{
  position: relative;
  padding: var(--s-4);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-1);
  display:flex; flex-direction:column; gap: 10px;
  overflow: hidden;
}
.box::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width: 4px;
  background: var(--box-color, var(--box-other));
}
.box-head{
  display:flex; align-items:center; justify-content: space-between;
  gap: 8px;
}
.box-name{ font-weight: 600; font-size: 15px; display:flex; align-items:center; gap: 8px; }
.box-name .swatch{
  width: 14px; height: 14px; border-radius: 4px;
  background: var(--box-color, var(--box-other));
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
}
.box-type{ font-size: 12px; color: var(--ink-3); }

.cap{
  display:flex; align-items:center; gap: 10px;
  margin-top: 2px;
}
.cap-bar{
  flex: 1; height: 6px; border-radius: 999px;
  background: var(--mute-bg); overflow:hidden; position: relative;
}
.cap-bar > i{
  display:block; height:100%; border-radius: inherit;
  background: var(--ok);
  width: 0%;
  transition: width .8s cubic-bezier(.2,.7,.2,1);
}
.cap[data-s="yellow"] .cap-bar > i{ background: var(--warn); }
.cap[data-s="red"]    .cap-bar > i{ background: var(--bad); }
.cap[data-s="unknown"] .cap-bar > i{ background: var(--mute); }
.cap-num{ font-family: var(--font-num); font-size: 13px; color: var(--ink-2); min-width: 38px; text-align: right; }
.box-note{ font-size: 13px; color: var(--ink-2); }

/* ============================================================
   INVENTORY LIST
   ============================================================ */
.inventory{
  display:grid; gap: var(--s-3);
  grid-template-columns: 1fr;
}
@media (min-width: 720px){
  .inventory{ grid-template-columns: 1fr 1fr; }
}
.item{
  position:relative;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s-4);
  display: grid;
  grid-template-columns: 44px 1fr auto;
  grid-template-rows: auto auto auto;
  gap: 4px 14px;
  box-shadow: var(--sh-1);
}
.item .stat-orb{ grid-column: 1; grid-row: 1 / span 2; align-self: start; }
.item .it-name{
  grid-column: 2; grid-row: 1;
  font-weight: 600; font-size: 15.5px; line-height: 1.2;
  display:flex; align-items:center; gap: 8px;
  min-width: 0; flex-wrap: wrap;
}
.item .it-meta{
  grid-column: 2; grid-row: 2;
  font-size: 12.5px; color: var(--ink-3);
  display:flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
  min-width: 0;
}
.item .it-meta .sep{ color: var(--ink-3); opacity:.5; }
.item .it-action{
  grid-column: 1 / -1; grid-row: 3;
  font-size: 13px; color: var(--ink-2);
  margin-top: 8px;
  padding-top: 10px; border-top: 1px dashed var(--line);
  line-height: 1.5;
}
.item .it-days{
  grid-column: 3; grid-row: 1 / span 2;
  align-self: start;
  text-align: right;
  font-family: var(--font-num);
  font-size: 12px; color: var(--ink-3);
}
.item .it-days strong{
  display:block; font-size: 22px; color: var(--ink); font-weight: 600;
  letter-spacing: -.02em;
}
.item .it-days[data-s="yellow"] strong{ color: var(--warn); }
.item .it-days[data-s="red"] strong{ color: var(--bad); }

.confidence{
  font-size: 11px; color: var(--ink-3); display:inline-flex; align-items:center; gap: 4px;
  font-family: var(--font-num);
}
.confidence::before{
  content:""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: .55;
}

/* status badge */
.badge{
  display:inline-flex; align-items:center; gap: 4px;
  height: 20px; padding: 0 8px;
  font-size: 11.5px; font-weight: 600;
  border-radius: var(--r-pill);
  background: var(--mute-bg); color: var(--mute);
  border: 1px solid var(--mute-line);
  white-space: nowrap;
}
.badge[data-s="green"]   { background: var(--ok-bg);   color: var(--ok);   border-color: var(--ok-line); }
.badge[data-s="yellow"]  { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-line); }
.badge[data-s="red"]     { background: var(--bad-bg);  color: var(--bad);  border-color: var(--bad-line); }
.badge[data-s="unknown"] { background: var(--mute-bg); color: var(--mute); border-color: var(--mute-line); }

/* ============================================================
   SCAN IMAGE (collapsible)
   ============================================================ */
.scan-shot{
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--sh-1);
  overflow: hidden;
}
.scan-shot summary{
  list-style: none; cursor: pointer;
  padding: var(--s-4); display:flex; align-items:center; gap: 12px;
}
.scan-shot summary::-webkit-details-marker{ display:none; }
.scan-shot .ss-thumb{
  width: 48px; height: 48px; border-radius: 10px; flex: none;
  background: var(--mute-bg);
  background-size: cover; background-position: center;
  position: relative; overflow:hidden;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
}
.scan-shot .ss-text{ flex: 1; min-width: 0; }
.scan-shot .ss-text strong{ display:block; font-size: 14px; font-weight:600; }
.scan-shot .ss-text small{ font-size: 12px; color: var(--ink-3); }
.scan-shot .ss-caret{
  width: 28px; height: 28px; display:grid; place-items:center;
  color: var(--ink-3); transition: transform .2s;
}
.scan-shot[open] .ss-caret{ transform: rotate(180deg); color: var(--ink); }
.scan-shot .ss-body{
  border-top: 1px solid var(--line);
  padding: var(--s-4);
}
.scan-shot .ss-body img{
  width: 100%;
  border-radius: var(--r-md);
  display: block;
  background: #1f221d;
}

/* ============================================================
   WASTE / ESG CARD
   ============================================================ */
.waste{
  background:
    radial-gradient(120% 80% at 100% 0%, #DDEEE0 0%, transparent 50%),
    linear-gradient(160deg, #2F7A5C 0%, #1F5740 100%);
  color: #F4F8F5;
  border-radius: var(--r-xl);
  padding: var(--s-6);
  border: 1px solid rgba(255,255,255,.06);
  position: relative;
  overflow: hidden;
  box-shadow: var(--sh-2);
}
.waste::after{
  content:"";
  position: absolute; inset: auto -10% -50% auto;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.08), transparent 60%);
  pointer-events: none;
}
.waste-eyebrow{
  font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: rgba(244,248,245,.7);
  display:flex; align-items:center; gap: 8px;
}
.waste-h{ margin: 8px 0 0; font-size: 16px; font-weight: 500; color: #E4F0E7; line-height: 1.5; }
.waste-stats{
  display:grid; grid-template-columns: 1fr 1fr;
  gap: var(--s-4);
  margin-top: var(--s-5);
}
.waste-stat .label{ font-size: 12px; color: rgba(244,248,245,.7); }
.waste-stat .value{
  font-family: var(--font-num); font-weight: 600;
  font-size: clamp(28px, 6vw, 36px); letter-spacing: -.01em; line-height: 1.05;
  margin-top: 4px; color: #fff;
}
.waste-stat .unit{ font-size: 14px; font-weight: 500; opacity:.85; margin-left: 2px; }
.waste-note{
  margin-top: var(--s-4);
  font-size: 13px; color: rgba(244,248,245,.78);
  border-top: 1px solid rgba(255,255,255,.12);
  padding-top: var(--s-3);
  line-height: 1.5;
}

/* ============================================================
   STATE BLOCKS
   ============================================================ */
.state-block{
  background: var(--card);
  border: 1px dashed var(--line-strong);
  border-radius: var(--r-xl);
  padding: 40px var(--s-5);
  text-align: center;
}
.state-block .ill{
  width: 64px; height: 64px; border-radius: 18px;
  display: grid; place-items:center;
  margin: 0 auto var(--s-4);
  background: var(--brand-soft); color: var(--brand-700);
}
.state-block h3{ margin: 0 0 6px; font-size: 17px; }
.state-block p{ margin: 0; font-size: 14px; color: var(--ink-2); max-width: 360px; margin-inline: auto; line-height: 1.6; }
.state-block .hint{ font-size: 12.5px; color: var(--ink-3); margin-top: var(--s-3); }
.state-block .actions{ margin-top: var(--s-4); display: inline-flex; gap: 8px; }

/* ============================================================
   NEW SCAN START STATE
   ============================================================ */
.new-scan-state{
  display: grid;
  place-items: center;
  padding: var(--s-6) var(--s-4);
}
.new-scan-card{
  width: 100%;
  max-width: 560px;
  background:
    radial-gradient(120% 100% at 0% 0%, var(--brand-tint) 0%, transparent 55%),
    linear-gradient(180deg, #FFFFFF 0%, #FCFBF7 100%);
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  padding: var(--s-7) var(--s-6);
  box-shadow: var(--sh-2);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.new-scan-card::after{
  content:""; position:absolute; inset:0;
  border-radius: inherit;
  pointer-events:none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
.new-scan-icon{
  width: 72px; height: 72px;
  border-radius: 22px;
  margin: 0 auto var(--s-4);
  display: grid; place-items: center;
  background:
    radial-gradient(120% 120% at 0% 0%, #6FB78F 0%, #2F7A5C 70%);
  color: #fff;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.18),
    0 10px 24px -8px rgba(47,122,92,.5);
}
.new-scan-title{
  font-size: clamp(20px, 4vw, 24px);
  font-weight: 700;
  letter-spacing: -.01em;
  margin: 0 0 var(--s-2);
  color: var(--ink);
}
.new-scan-subtitle{
  font-size: 14.5px;
  line-height: 1.65;
  color: var(--ink-2);
  margin: 0 auto var(--s-5);
  max-width: 420px;
}
.new-scan-actions{
  display: flex;
  justify-content: center;
  margin-bottom: var(--s-5);
}
.new-scan-actions .btn{
  height: 48px;
  padding: 0 24px;
  font-size: 15px;
}
.new-scan-bullets{
  display: grid;
  gap: 10px;
  text-align: left;
  border-top: 1px solid var(--line);
  padding-top: var(--s-4);
  margin: 0 auto;
  max-width: 420px;
}
.new-scan-bullet{
  display: grid;
  grid-template-columns: 20px 1fr;
  gap: 10px;
  align-items: start;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.55;
}
.new-scan-bullet svg{
  margin-top: 2px;
  color: var(--brand);
  flex-shrink: 0;
}

/* ============================================================
   FLOATING SCAN FAB (mobile)
   ============================================================ */
.fab{
  display: none;
  position: fixed; right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom));
  height: 56px; padding: 0 22px;
  border-radius: var(--r-pill);
  background: var(--brand); color:#fff; font-weight:600; font-size: 15px;
  box-shadow: 0 12px 28px -8px rgba(47,122,92,.55), 0 1px 0 rgba(255,255,255,.2) inset;
  z-index: 25;
  align-items: center; gap: 8px;
  border: 0;
}
.fab:active{ transform: translateY(1px); }
.fab:disabled{ background: #9DBFAE; cursor: not-allowed; box-shadow: none; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 880px){
  .app{ grid-template-columns: 1fr !important; }
  .sidebar{
    position: fixed; top: 0; left: 0;
    z-index: 50;
    box-shadow: 0 0 0 1px var(--line);
  }
  .app[data-sidebar="open"] .scrim{ opacity:1; pointer-events:auto; }
  .header-inner .scan-cta{ display: none; }
  .header-inner .new-cta{ display: none; }
  .fab{ display:inline-flex; }
  .content{ padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .brand-meta{ display: none; }
}
</style>
</head>

<body>

<div class="app" id="app" data-sidebar="closed">

  <!-- ============================================================
       SIDEBAR  /  HISTORY
       ============================================================ -->
  <aside class="sidebar" id="sidebar" aria-label="掃描歷史紀錄">
    <div class="sb-head">

      <button class="sb-close" id="sidebarClose" aria-label="收合歷史紀錄">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <div class="sb-actions">
      <button class="sidebar-new-scan-btn" id="sidebarNewScanBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

  <!-- ============================================================

    <header class="header">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="brand">
          <div class="brand-mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="5" y1="10" x2="19" y2="10"/><line x1="9" y1="6" x2="9" y2="7"/><line x1="9" y1="14" x2="9" y2="15"/></svg>

          <div class="brand-text">

              <span id="lastScan">最後掃描：—</span>

          </div>

        <button class="btn btn-ghost btn-sm new-cta" id="newWorkspaceBtn">＋ 新掃描</button>
        <button class="btn btn-primary scan-cta" id="scanBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
          <span>掃描食物</span>
        </button>
      </div>
    </header>

    <main class="content">

      <!-- ── Status / Review banner ── -->
      <section class="status-area" id="sec-status">
        <div class="review-banner hidden" id="reviewBanner" role="status">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="review-banner-text" id="reviewBannerText">—</span>
          <div class="review-banner-actions">
            <button id="exitReviewBtn">回到最新結果</button>
            <button id="newWorkspaceBannerBtn">＋ 新掃描</button>
          </div>

        <div class="status-msg" id="statusMsg">尚未掃描。</div>
        <div class="status-line"><span id="itemCount">—</span></div>

          <div class="new-scan-actions">
            <button class="btn btn-primary" id="newScanStartBtn" type="button">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
              <span>掃描食物</span>
            </button>
          </div>

            <li class="new-scan-bullet">

              <span>掃描後會自動更新冰箱狀態</span>
            </li>
            <li class="new-scan-bullet">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

              <span>若辨識到既有食材，系統會沿用先前的存放天數</span>

            <div class="shop-list" id="shoppingList"></div>
          </div>

      <!-- ── 3. 收納盒總覽 ── -->
      <section class="hidden" id="sec-boxes" aria-labelledby="boxH">
        <div class="section-head">
          <div class="section-title" id="boxH">收納盒總覽</div>
          <span class="section-meta" id="boxesMeta"></span>
        </div>
        <div class="boxes" id="boxList"></div>

      <!-- ── 4. 全部食材 ── -->
      <section class="hidden" id="sec-items" aria-labelledby="invH">
        <div class="section-head">
          <div class="section-title" id="invH">全部食材</div>
          <span class="section-meta" id="itemCountMeta"></span>
        </div>
        <div class="inventory" id="itemList"></div>
      </section>

      <!-- ── 5. 本次掃描照片（可收合）── -->

          <div class="ss-thumb" id="ssThumb" aria-hidden="true"></div>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6"/><path d="M12 22a8 8 0 0 0 8-8c0-3-2-5-2-9-2 2-6 2-6 6 0 0-2-2-2-5-2 2-6 4-6 8a8 8 0 0 0 8 8z"/></svg>
          <span>本次減少浪費</span>
        </div>
        <h2 class="waste-h" id="wasteH">優先使用即將過期食材，正在累積你的環境影響力。</h2>

<!-- mobile-only floating scan FAB -->
<button class="fab" id="fabScan" aria-label="掃描食物">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
  <span>掃描食物</span>
</button>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 工具
// ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);

function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

const ALLOWED_STATUS = ['green', 'yellow', 'red', 'unknown'];
function normStatus(s) {
    s = String(s || '').toLowerCase();
    return ALLOWED_STATUS.includes(s) ? s : 'unknown';
}
function statusToText(s) {
    return ({
        green: '新鮮', yellow: '建議優先食用', red: '高風險', unknown: '需確認',
    })[normStatus(s)];
}

// SVG icon by status (used inside .stat-orb)
function statusOrbIcon(s) {
    const c = normStatus(s);
    if (c === 'green') {
        return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    }
    if (c === 'yellow') {
        return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    }
    if (c === 'red') {
        return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    }
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
}

// Map box_type → CSS color variable for swatch
function boxColorVar(boxType) {
    const t = String(boxType || '');
    if (t.includes('蔬菜')) return 'var(--box-veg)';
    if (t.includes('肉'))   return 'var(--box-meat)';
    if (t.includes('魚'))   return 'var(--box-fish)';
    if (t.includes('蛋'))   return 'var(--box-dairy)';
    if (t.includes('水果')) return 'var(--box-fruit)';
    if (t.includes('熟食')) return 'var(--box-cooked)';
    if (t.includes('飲品')) return 'var(--box-drink)';
    return 'var(--box-other)';
}

function setStatusMsg(msg, cls = '') {
    const el = $('statusMsg');
    el.className = 'status-msg' + (cls ? ' ' + cls : '');
    el.textContent = msg;
}
function setBrandDot(cls) {
    const el = $('brandDot');
    if (!el) return;
    el.className = 'dot' + (cls ? ' is-' + cls : '');
}
function show(secId) { $(secId).classList.remove('hidden'); }
function hide(secId) { $(secId).classList.add('hidden'); }
function hideAll() {
    ['sec-priority','sec-recipes-shopping','sec-boxes',
     'sec-items','sec-image','sec-waste'].forEach(id => $(id).classList.add('hidden'));
}

// ─────────────────────────────────────────────────────────────────────────────
// 狀態管理
// currentMode: 'latest' | 'history' | 'new'
// ─────────────────────────────────────────────────────────────────────────────
let currentMode     = 'latest';
let activeHistoryId = null;
let latestResultCache = null;

function setMode(mode) { currentMode = mode; }

// ─────────────────────────────────────────────────────────────────────────────
// Sidebar
// ─────────────────────────────────────────────────────────────────────────────
let sidebarOpen = false;

function toggleSidebar(open) {
    if (open === undefined) open = !sidebarOpen;
    sidebarOpen = Boolean(open);
    $('app').dataset.sidebar = sidebarOpen ? 'open' : 'closed';
    $('sidebarToggle').classList.toggle('is-on', sidebarOpen);
    $('sidebarToggle').setAttribute('aria-expanded', sidebarOpen ? 'true' : 'false');
}

$('sidebarToggle').addEventListener('click', () => toggleSidebar());
$('sidebarClose').addEventListener('click', () => toggleSidebar(false));
$('sidebarOverlay').addEventListener('click', () => toggleSidebar(false));
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && sidebarOpen) toggleSidebar(false);
});

// ─────────────────────────────────────────────────────────────────────────────
// Renderers
// ─────────────────────────────────────────────────────────────────────────────
function renderPriorityItems(analysis) {
    const wrap = $('priorityList');
    const headline = $('prioH');
    const section = $('sec-priority');

    let list = analysis.priority_items;
    if (!Array.isArray(list) || list.length === 0) {
        list = (analysis.items || [])
            .filter(it => ['yellow','red'].includes(normStatus(it.status)))
            .map(it => ({
                name: it.name, status: it.status,
                reason: it.freshness_observation,
                suggested_action: it.suggested_action,
            }));
    }

    if (list.length === 0) {
        section.classList.add('is-calm');
        headline.innerHTML = '今日狀態良好，<em>目前沒有需要優先處理的食材</em>。';
        wrap.innerHTML = '';
    } else {
        section.classList.remove('is-calm');
        const n = list.length;
        headline.innerHTML = `有 <em>${n} 項食材</em>建議優先處理，請依序確認。`;
        wrap.innerHTML = list.map(p => {
            const cls = normStatus(p.status);
            return `
                <div class="p-item">
                    <div class="stat-orb" data-s="${cls}" aria-hidden="true">${statusOrbIcon(cls)}</div>
                    <div>
                        <div class="p-name">${esc(p.name)} <span class="badge" data-s="${cls}">${statusToText(cls)}</span></div>
                        <div class="p-reason">${esc(p.reason || '—')}</div>
                        ${p.suggested_action ? `<div class="p-action">建議：${esc(p.suggested_action)}</div>` : ''}
                    </div>
                </div>`;
        }).join('');
    }
    show('sec-priority');
}

function renderRecipes(analysis) {
    const list = analysis.recipe_suggestions || [];
    const wrap = $('recipeList');
    if (list.length === 0) {
        wrap.innerHTML = `<div class="empty">尚無料理建議。</div>`;
    } else {
        wrap.innerHTML = list.map((r, i) => {
            const ings = (r.ingredients || []).map(esc);
            const thumbCls = ['', 'thumb-2', 'thumb-3'][i % 3];
            return `
                <article class="recipe">
                    <div class="recipe-thumb ${thumbCls}">${ings.slice(0,2).join(' · ') || '—'}</div>
                    <h4>${esc(r.name)}</h4>
                    <div class="ings">${ings.map(t => `<span class="tag">${t}</span>`).join('') || '<span class="tag">—</span>'}</div>
                    <div class="reason">${esc(r.reason || '—')}</div>
                </article>`;
        }).join('');
    }
}

function renderShoppingReminder(analysis) {
    const list = analysis.shopping_reminder || [];
    const wrap = $('shoppingList');
    if (list.length === 0) {
        wrap.innerHTML = `<div class="empty">目前沒有明顯重複購買風險。</div>`;
    } else {
        wrap.innerHTML = list.map(s => {
            const text = String(s || '');
            const isNoRisk = /沒有明顯/.test(text);
            const cls = isNoRisk ? 'is-ok' : '';
            const icon = isNoRisk
                ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
                : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
            return `
                <div class="shop-row ${cls}">
                    <div class="shop-icon">${icon}</div>
                    <p>${esc(text)}</p>
                </div>`;
        }).join('');
    }
}

function renderBoxSummary(analysis) {
    const list = analysis.box_summary || [];
    const wrap = $('boxList');
    const meta = $('boxesMeta');
    if (list.length === 0) {
        wrap.innerHTML = `<div class="empty">無收納盒資料。</div>`;
        if (meta) meta.textContent = '';
    } else {
        if (meta) meta.textContent = `共 ${list.length} 盒`;
        wrap.innerHTML = list.map(b => {
            const cls = normStatus(b.status);
            const pct = Math.max(0, Math.min(100, Number(b.capacity_percent) || 0));
            const colorVar = boxColorVar(b.box_type || b.box_name);
            return `
                <article class="box" style="--box-color: ${colorVar};">
                    <div class="box-head">
                        <div class="box-name"><span class="swatch"></span>${esc(b.box_name || '—')}</div>
                        <span class="badge" data-s="${cls}">${statusToText(cls)}</span>
                    </div>
                    <div class="box-type">${esc(b.box_type || '')}</div>
                    <div class="cap" data-s="${cls}">
                        <div class="cap-bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
                        <div class="cap-num">${pct}%</div>
                    </div>
                    <div class="box-note">${esc(b.note || '')}</div>
                </article>`;
        }).join('');
    }
    show('sec-boxes');
}

function renderFoodItems(analysis) {
    const list = analysis.items || [];
    const wrap = $('itemList');
    const meta = $('itemCountMeta');
    if (list.length === 0) {
        wrap.innerHTML = `<div class="empty">本次未偵測到食材。</div>`;
        if (meta) meta.textContent = '';
    } else {
        if (meta) meta.textContent = `本次偵測到 ${list.length} 項`;
        wrap.innerHTML = list.map(it => {
            const cls = normStatus(it.status);
            const conf = Math.round((Number(it.confidence) || 0) * 100);
            const stored = it.stored_days ?? '?';
            const est = it.estimated_storage_days ?? '?';
            const remain = (it.remaining_days ?? (
                (Number(it.estimated_storage_days) || 0) - (Number(it.stored_days) || 0)
            ));
            const remainDisplay = (cls === 'unknown') ? '—' : remain;

            return `
                <article class="item">
                    <div class="stat-orb" data-s="${cls}">${statusOrbIcon(cls)}</div>
                    <div class="it-name">${esc(it.name)} <span class="badge" data-s="${cls}">${statusToText(cls)}</span></div>
                    <div class="it-meta">
                        <span>${esc(it.category || '')}</span>
                        ${it.box_name ? `<span class="sep">·</span><span>${esc(it.box_name)}</span>` : ''}
                        <span class="sep">·</span>
                        <span>已存 ${esc(stored)} / 估 ${esc(est)} 天</span>
                        <span class="sep">·</span>
                        <span class="confidence" title="AI 信心 ${conf}%">${conf}%</span>
                    </div>
                    <div class="it-days" data-s="${cls}"><strong class="num">${esc(remainDisplay)}</strong>${cls === 'unknown' ? '需確認' : '天剩餘'}</div>
                    ${(it.suggested_action || it.freshness_observation) ? `
                    <div class="it-action">
                        ${it.freshness_observation ? `🔍 ${esc(it.freshness_observation)}` : ''}
                        ${it.freshness_observation && it.suggested_action ? '<br>' : ''}
                        ${it.suggested_action ? `💡 ${esc(it.suggested_action)}` : ''}
                    </div>` : ''}
                </article>`;
        }).join('');
    }
    show('sec-items');
}

function renderWasteReduction(analysis) {
    const wr = analysis.waste_reduction;
    const wrap = $('wasteContent');
    if (!wr) {
        wrap.innerHTML = `<div style="color:rgba(244,248,245,.7);font-size:14px;margin-top:16px;">尚未估算。</div>`;
    } else {
        wrap.innerHTML = `
            <div class="waste-stats">
                <div class="waste-stat">
                    <div class="label">預估省下</div>
                    <div class="value"><span class="num">${esc(wr.estimated_saved_money ?? 0)}</span><span class="unit"> 元</span></div>
                </div>
                <div class="waste-stat">
                    <div class="label">減少廚餘</div>
                    <div class="value"><span class="num">${esc(wr.estimated_reduced_waste_kg ?? 0)}</span><span class="unit"> kg</span></div>
                </div>
            </div>
            <p class="waste-note">${esc(wr.note || '')}</p>`;
    }
    show('sec-waste');
}

function renderImage(data) {
    if (!data.image_url) return;
    const url = data.image_url + '?t=' + Date.now();
    $('preview').src = url;
    $('ssThumb').style.backgroundImage = `url('${url}')`;
    $('imageTs').textContent = data.timestamp
        ? '時間：' + new Date(data.timestamp * 1000).toLocaleString()
        : '';
    show('sec-image');
}

function renderDashboard(data) {
    const a = data.analysis;
    if (!a) { setStatusMsg('尚未取得分析結果。', 'warn'); return; }
    const itemN = (a.items || []).length;
    setStatusMsg('✅ 掃描完成', 'ok');
    if (data.timestamp) {
        $('lastScan').textContent = '最後掃描：' + new Date(data.timestamp * 1000).toLocaleString();
    }
    $('itemCount').textContent = `成功偵測 ${itemN} 項食材`;
    setBrandDot('ok');

    renderPriorityItems(a);
    renderRecipes(a);
    renderShoppingReminder(a);
    show('sec-recipes-shopping');
    renderBoxSummary(a);
    renderFoodItems(a);
    renderImage(data);
    renderWasteReduction(a);
}

// ─────────────────────────────────────────────────────────────────────────────
// 回顧模式
// ─────────────────────────────────────────────────────────────────────────────
function clearReviewState() {
    activeHistoryId = null;
    $('reviewBanner').classList.add('hidden');
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('is-active'));
}

function exitReviewMode() { clearReviewState(); }

function enterReviewMode(record) {
    setMode('history');
    activeHistoryId = record.id;
    hide('sec-empty-workspace');
    $('reviewBannerText').textContent =
        `目前正在回顧：${record.created_at || record.id} 的掃描紀錄`;
    $('reviewBanner').classList.remove('hidden');
    document.querySelectorAll('.history-item').forEach(el => {
        el.classList.toggle('is-active', el.dataset.id === record.id);
    });
}

// ─────────────────────────────────────────────────────────────────────────────
// 新掃描工作區（New Scan Session — ChatGPT 風格的「新對話」）
//
// 行為：
//   1. 清除回顧狀態 + active history item
//   2. 取消任何進行中的掃描輪詢（避免舊結果覆蓋新畫面）
//   3. 隱藏所有 dashboard 區塊
//   4. 渲染新掃描起始介面
//   5. 不刪除歷史紀錄、不清空 inventory、不呼叫 /scan-request、不呼叫 Gemini
// ─────────────────────────────────────────────────────────────────────────────
function renderNewScanStartState() {
    hideAll();
    show('sec-empty-workspace');
}

function startNewScanSession() {
    setMode('new');
    clearReviewState();
    cancelScanPolling();          // 中斷任何進行中的 poll，避免舊掃描覆蓋新畫面
    renderNewScanStartState();
    setStatusMsg('新的掃描工作區', '');
    $('lastScan').textContent  = '最後掃描：—';
    $('itemCount').textContent = '—';
    setBrandDot('');
}

// 舊名稱保留為 alias，避免任何外部呼叫被打斷
const startNewWorkspace = startNewScanSession;

$('newWorkspaceBtn').addEventListener('click', () => startNewScanSession());
$('newWorkspaceBannerBtn').addEventListener('click', () => startNewScanSession());

// Sidebar 頂部主按鈕（ChatGPT 風格）— 在 mobile 上自動收 sidebar
$('sidebarNewScanBtn').addEventListener('click', () => {
    startNewScanSession();
    if (window.innerWidth < 880) toggleSidebar(false);
});

// 新掃描起始介面內的主 CTA → 直接觸發既有掃描流程
$('newScanStartBtn').addEventListener('click', () => startScan());

// ─────────────────────────────────────────────────────────────────────────────
// 載入最新結果
// ─────────────────────────────────────────────────────────────────────────────
async function loadLatestResult() {
    try {
        const r = await fetch('/latest-result').then(res => res.json());
        if (r.success && r.analysis) {
            latestResultCache = r;
            lastImageUrl = r.image_url;
            setMode('latest');
            hide('sec-empty-workspace');
            renderDashboard(r);
            setStatusMsg('（顯示最新掃描結果）', '');
        } else {
            hideAll();
            hide('sec-empty-workspace');
            setStatusMsg('目前尚無最新掃描結果，請先按下「掃描食物」。', 'warn');
            setBrandDot('warn');
        }
    } catch (_) { /* 忽略 */ }
}

// ─────────────────────────────────────────────────────────────────────────────
// 掃描流程
// ─────────────────────────────────────────────────────────────────────────────
const scanBtn = $('scanBtn');
const fabScan = $('fabScan');
let waiting = false;
let lastImageUrl = null;
let scanPollTimer = null;       // module-scope，讓 startNewScanSession() 可以中斷

function cancelScanPolling() {
    if (scanPollTimer) {
        clearInterval(scanPollTimer);
        scanPollTimer = null;
    }
    if (waiting) {
        // 若使用者按了「新掃描」，就明確結束舊的等待狀態
        resetScanButtons();
    }
}

async function startScan() {
    if (waiting) return;
    waiting = true;
    scanBtn.disabled = true;
    fabScan.disabled = true;
    scanBtn.querySelector('span').textContent = '掃描中…';
    fabScan.querySelector('span').textContent = '掃描中…';
    clearReviewState();
    hide('sec-empty-workspace');
    setBrandDot('warn');

    setStatusMsg('⏳ 已送出掃描請求，等待設備拍照…', 'warn');
    try {
        await fetch('/scan-request', { method: 'POST' });
    } catch (e) {
        setStatusMsg('❌ 無法連線後端，請確認伺服器狀態。', 'err');
        resetScanButtons();
        return;
    }

    const startedAt = Date.now();

    const poll = async () => {
        let r;
        try {
            r = await fetch('/latest-result').then(res => res.json());
        } catch (e) {
            setStatusMsg('❌ 連線中斷，稍後重試。', 'err');
            return;
        }
        if (r.scan_pending) {
            setStatusMsg('🔍 設備分析中…', 'warn');
        }
        if (r.success && r.image_url !== lastImageUrl && !r.scan_pending) {
            cancelScanPolling();
            lastImageUrl = r.image_url;
            latestResultCache = r;
            setMode('latest');
            clearReviewState();
            hide('sec-empty-workspace');
            renderDashboard(r);
            loadHistory().catch(() => {});
            return;
        }
        if (Date.now() - startedAt > 30000) {
            cancelScanPolling();
            setStatusMsg('❌ 等了 30 秒沒收到結果，請確認 A 手機是否在線。', 'err');
            setBrandDot('bad');
        }
    };

    scanPollTimer = setInterval(poll, 1000);
    poll();
}

function resetScanButtons() {
    waiting = false;
    scanBtn.disabled = false;
    fabScan.disabled = false;
    scanBtn.querySelector('span').textContent = '掃描食物';
    fabScan.querySelector('span').textContent = '掃描食物';
}

scanBtn.addEventListener('click', startScan);
fabScan.addEventListener('click', startScan);

// ─────────────────────────────────────────────────────────────────────────────
// 歷史紀錄
// ─────────────────────────────────────────────────────────────────────────────
async function loadHistory() {
    const wrap = $('historyList');
    try {
        const r = await fetch('/history').then(res => res.json());
        if (!r || r.success !== true) {
            wrap.innerHTML = `<div class="sb-empty">無法載入歷史紀錄。</div>`;
            return;
        }
        renderHistory(r.records || []);
    } catch (e) {
        console.warn('loadHistory error', e);
        wrap.innerHTML = `<div class="sb-empty">無法載入歷史紀錄。</div>`;
    }
}

function priorityBadgeFromSummary(summary) {
    const s = String(summary || '');
    if (/沒有高風險/.test(s)) return { cls: 'green', text: '良好' };
    if (/[1-9]\d* 項/.test(s)) return { cls: 'yellow', text: '需處理' };
    return { cls: 'unknown', text: '—' };
}

function renderHistory(records) {
    const wrap = $('historyList');
    if (!Array.isArray(records) || records.length === 0) {
        wrap.innerHTML = `<div class="sb-empty">尚無掃描紀錄。</div>`;
        return;
    }
    wrap.innerHTML = records.map(r => {
        const id = r.id || '';
        const isActive = (id === activeHistoryId);
        const badge = priorityBadgeFromSummary(r.priority_summary);
        return `
            <button type="button" class="history-item${isActive ? ' is-active' : ''}" data-id="${esc(id)}">
                <div class="hi-row">
                    <span class="hi-time num">${esc(r.created_at || '—')}</span>
                    <span class="badge" data-s="${badge.cls}">${badge.text}</span>
                </div>
                <div class="hi-summary">${esc(r.summary || '—')}</div>
                <div class="hi-meta">
                    <span>${Number(r.item_count || 0)} 項</span>
                    <span>·</span>
                    <span>${esc(r.priority_summary || '')}</span>
                </div>
                <span class="hi-del" data-action="delete" data-id="${esc(id)}" title="刪除這筆紀錄" role="button" aria-label="刪除">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </span>
            </button>`;
    }).join('');
}

async function loadHistoryRecord(recordId) {
    try {
        const res = await fetch('/history/' + encodeURIComponent(recordId));
        if (res.status === 404) {
            alert('找不到該筆歷史紀錄，可能已被刪除。');
            await loadHistory();
            return;
        }
        const r = await res.json();
        if (!r || r.success !== true || !r.record) {
            alert('無法載入歷史紀錄。');
            return;
        }
        const rec = r.record;
        hide('sec-empty-workspace');
        renderDashboard({
            success: true,
            image_url: rec.image_url,
            analysis: rec.analysis || {},
            timestamp: parseCreatedAt(rec.created_at),
        });
        setStatusMsg(`正在回顧 ${rec.created_at || rec.id} 的掃描結果`, '');
        enterReviewMode(rec);
        if (window.innerWidth < 880) toggleSidebar(false);
        $('sec-status').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
        console.warn('loadHistoryRecord error', e);
        alert('載入歷史紀錄時發生錯誤。');
    }
}

function parseCreatedAt(s) {
    if (!s) return Date.now() / 1000;
    const t = Date.parse(String(s).replace(' ', 'T'));
    return isNaN(t) ? (Date.now() / 1000) : (t / 1000);
}

async function deleteHistoryRecord(recordId, event) {
    if (event) event.stopPropagation();
    if (!confirm('確定要刪除這筆掃描紀錄嗎？')) return;
    try {
        const res = await fetch('/history/' + encodeURIComponent(recordId), { method: 'DELETE' });
        const r = await res.json().catch(() => ({}));
        if (res.ok && r.success) {
            if (activeHistoryId === recordId) {
                startNewWorkspace();
            }
            await loadHistory();
        } else {
            alert(r.error || '刪除失敗。');
        }
    } catch (e) {
        console.warn('deleteHistoryRecord error', e);
        alert('刪除時發生錯誤。');
    }
}

$('historyList').addEventListener('click', (e) => {
    const deleteBtn = e.target.closest('[data-action="delete"]');
    if (deleteBtn) {
        e.stopPropagation();
        deleteHistoryRecord(deleteBtn.dataset.id, e);
        return;
    }
    const card = e.target.closest('.history-item[data-id]');
    if (card) loadHistoryRecord(card.dataset.id);
});

$('refreshHistoryBtn').addEventListener('click', () => loadHistory());

$('exitReviewBtn').addEventListener('click', async () => {
    clearReviewState();
    setMode('latest');
    await loadLatestResult();
});

// ─────────────────────────────────────────────────────────────────────────────
// 頁面載入
// ─────────────────────────────────────────────────────────────────────────────
(async function loadInitial() {
    // 桌面預設打開 sidebar，行動裝置預設收合
    toggleSidebar(window.matchMedia('(min-width: 880px)').matches);

    try {
        const r = await fetch('/latest-result').then(res => res.json());
        if (r.success && r.analysis) {
            latestResultCache = r;
            lastImageUrl = r.image_url;
            setMode('latest');
            renderDashboard(r);
            setStatusMsg('（顯示上次掃描結果）', '');
        } else {
            startNewWorkspace();
        }
    } catch (_) {
        startNewWorkspace();
    }
    loadHistory().catch(() => {});
})();
</script>
